version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: leadsilly-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadsilly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount schema so it auto-initializes on startup
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    container_name: leadsilly-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/leadsilly
      - JWT_SECRET=leadsilly_jwt_secret_key_987654321
    depends_on:
      - db

volumes:
  postgres_data:
